<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TARIFLY — Админ-панель</title>
<style>
/* ============================================================
   БАЗА
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #f0f2f8;
  --bg-card: #ffffff;
  --ink: #14161c;
  --ink-soft: #6b7280;
  --line: #e5e9f2;
  --accent: #7b5cff;
  --accent-soft: #f0edff;
  --green: #22b573;
  --red: #e30613;
  --orange: #f2790f;
  --radius: 14px;
}
body {
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  font-size: 14px;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: 14px; }
img, svg { display: block; }

/* ============================================================
   САЙДБАР
   ============================================================ */
.sidebar {
  width: 240px;
  flex-shrink: 0;
  background: #ffffff;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  z-index: 10;
}
.brand {
  padding: 22px 20px 18px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: 4px;
}
.brand span {
  font-size: 9px;
  background: var(--accent);
  color: #fff;
  padding: 3px 7px;
  border-radius: 6px;
  letter-spacing: 1px;
  font-weight: 700;
}
.sidebar nav { padding: 14px 12px; flex: 1; overflow-y: auto; }
.sidebar nav a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-radius: 12px;
  color: var(--ink-soft);
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
  margin-bottom: 2px;
  transition: all 0.15s;
  text-decoration: none;
}
.sidebar nav a:hover { background: #f6f7fb; color: var(--ink); }
.sidebar nav a.active { background: var(--accent-soft); color: var(--accent); }
.sidebar nav a svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-footer {
  padding: 14px 16px;
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--ink-soft);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sidebar-footer a {
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
}

/* ============================================================
   ОСНОВНОЙ КОНТЕНТ
   ============================================================ */
.main {
  margin-left: 240px;
  flex: 1;
  padding: 24px 32px 60px;
  max-width: calc(100vw - 240px);
}
.top-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.top-head h1 {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.top-head p {
  color: var(--ink-soft);
  font-size: 13px;
  margin-top: 4px;
}
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  transition: all 0.15s;
  border: 1px solid transparent;
}
.btn svg { width: 15px; height: 15px; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #6447e8; }
.btn-secondary { background: #fff; color: var(--ink); border-color: var(--line); }
.btn-secondary:hover { border-color: #c8cde0; }
.btn-danger { background: #fff; color: var(--red); border-color: #f7d7d9; }
.btn-danger:hover { background: #fdf2f2; }
.btn-sm { padding: 7px 11px; font-size: 12px; border-radius: 8px; }
.btn-icon {
  padding: 7px;
  width: 32px;
  height: 32px;
  justify-content: center;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #fff;
}
.btn-icon:hover { border-color: #c8cde0; background: #fafbff; }
.btn-icon.danger { color: var(--red); }
.btn-icon.danger:hover { background: #fdf2f2; border-color: #f7d7d9; }

/* ============================================================
   ТАБЛИЦА
   ============================================================ */
.card {
  background: #fff;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  overflow: hidden;
  box-shadow: 0 2px 10px rgba(30, 41, 82, 0.03);
}
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}
table th {
  text-align: left;
  padding: 14px 16px;
  background: #fafbff;
  font-weight: 700;
  color: var(--ink-soft);
  font-size: 11.5px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
table td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
table tr:last-child td { border-bottom: none; }
table tr:hover td { background: #fafbff; }
.td-actions { display: flex; gap: 6px; justify-content: flex-end; }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
}
.tag-mts { background: #fdeaea; color: #e30613; }
.tag-mfn { background: #e8f8ef; color: #3a9d3f; }
.tag-bee { background: #fff7db; color: #b38600; }
.tag-yota { background: #e6f6ff; color: #1a8fc7; }
.tag-done { background: #e8f8ef; color: var(--green); }
.tag-process { background: #eef2ff; color: #5b6cff; }
.tag-wait { background: #fff4e5; color: var(--orange); }

.empty {
  padding: 50px 20px;
  text-align: center;
  color: var(--ink-soft);
  font-size: 14px;
}
.empty svg { width: 48px; height: 48px; margin: 0 auto 12px; opacity: 0.4; }

/* ============================================================
   МОДАЛКА
   ============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 22, 28, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff;
  border-radius: 18px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
  animation: modalIn 0.2s ease;
}
@keyframes modalIn {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-head {
  padding: 20px 24px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-head h2 { font-size: 17px; font-weight: 800; }
.modal-close {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-soft);
  transition: all 0.15s;
}
.modal-close:hover { background: #f4f5f8; color: var(--ink); }
.modal-body { padding: 20px 24px; }
.modal-foot {
  padding: 16px 24px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: #fafbff;
}

/* ============================================================
   ФОРМА
   ============================================================ */
.form-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}
.form-row label {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-soft);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.form-row input,
.form-row select,
.form-row textarea {
  padding: 11px 13px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: #fff;
  outline: none;
  transition: all 0.15s;
  color: var(--ink);
  width: 100%;
}
.form-row input:focus,
.form-row select:focus,
.form-row textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(123, 92, 255, 0.12);
}
.form-row textarea { resize: vertical; min-height: 80px; }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-hint { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

/* ============================================================
   УВЕДОМЛЕНИЕ (toast)
   ============================================================ */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--ink);
  color: #fff;
  padding: 12px 22px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
  z-index: 999;
  opacity: 0;
  transition: all 0.3s;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
.toast.success { background: var(--green); }
.toast.error { background: var(--red); }

/* ============================================================
   АДАПТИВ
   ============================================================ */
.menu-toggle {
  display: none;
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 20;
  width: 44px;
  height: 44px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 14px rgba(30, 41, 82, 0.1);
  align-items: center;
  justify-content: center;
}

@media (max-width: 900px) {
  .sidebar {
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.15);
  }
  .sidebar.open { transform: translateX(0); }
  .main {
    margin-left: 0;
    max-width: 100vw;
    padding: 72px 20px 60px;
  }
  .menu-toggle { display: flex; }
}
@media (max-width: 600px) {
  .top-head h1 { font-size: 22px; }
  .form-row-2 { grid-template-columns: 1fr; }
  table th, table td { padding: 11px 12px; font-size: 12.5px; }
  .td-actions { flex-direction: column; }
}

/* Планы тарифа в модалке */
.plans-editor {
  margin-top: 8px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.plans-editor-title {
  font-size: 13px;
  font-weight: 800;
  margin-bottom: 4px;
}
.plan-row {
  background: #fafbff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
}
.plan-row-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.plan-row-head strong { font-size: 13px; }

</style>
</head>
<body>

<main class="main">

      <p id="pageDesc">Управление тарифами для сайта</p>

</div>
